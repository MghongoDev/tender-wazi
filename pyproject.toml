[project]
name = "tender-wazi"
version = "0.1.0"
description = "An open record of Kenyan public tenders"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.34",
    "PyYAML>=6.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tender_wazi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
